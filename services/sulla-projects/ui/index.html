<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects</title><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head>
<body><div class="workspace"><aside><h1>Projects</h1><button id="all-projects">All projects</button><nav id="project-nav" aria-label="Projects"></nav><p id="session">Waiting for your console session…</p></aside><main><header><div><p id="eyebrow">Workspace</p><h2 id="title">Projects</h2></div><div class="actions"><button id="refresh">Refresh</button><button id="edit-project" hidden>Edit project</button><button id="manage-epics" hidden>Epics</button><button id="add-epic" hidden>Add epic</button><button id="add" class="primary" disabled>New project</button></div></header><div id="notice" role="status" aria-live="polite"></div><div class="toolbar"><input id="search" type="search" placeholder="Search projects" aria-label="Search"><select id="epic-filter" aria-label="Filter by epic" hidden></select><button id="view" hidden>Table view</button></div><section id="content" aria-label="Project content"></section></main></div><dialog id="editor"><form id="edit-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="close" aria-label="Close">×</button></div><div id="fields"></div><div id="comments"></div><p id="form-error" role="alert"></p><footer><button id="archive" type="button" hidden>Archive</button><button id="save" type="submit" class="primary">Save</button></footer></form></dialog></body></html>
