apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: sulla-files }
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: sulla-files-backup }
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: sulla-files-backup }
spec: { storageClassName: sulla-files-backup, accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
