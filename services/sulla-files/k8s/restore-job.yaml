apiVersion: batch/v1
kind: Job
metadata: { name: sulla-files-restore }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: ghcr.io/merchantprotocol/sulla-files:latest
          command: ["node", "dist/index.js", "restore"]
          env:
            - { name: SULLA_FILES_DATABASE_URL, value: "postgresql://unused" }
            - { name: SULLA_FILES_CAPABILITY_SIGNING_KEY, valueFrom: { secretKeyRef: { name: sulla-server, key: files-internal-token } } }
            - { name: SULLA_FILES_BACKUP_TARGET, value: /backup }
          volumeMounts:
            - { name: files, mountPath: /var/lib/sulla-files }
            - { name: backup, mountPath: /backup, readOnly: true }
      volumes:
        - { name: files, persistentVolumeClaim: { claimName: sulla-files } }
        - { name: backup, persistentVolumeClaim: { claimName: sulla-files-backup } }
