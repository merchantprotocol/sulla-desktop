services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sulla
      POSTGRES_PASSWORD: ${SULLA_POSTGRES_PASSWORD}
      POSTGRES_DB: sulla
    volumes:
      - ${SULLA_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulla -d sulla"]
      interval: 5s
      timeout: 3s
      retries: 30
  vault:
    image: sulla-vault:${SULLA_IMAGE_TAG}
    build:
      context: ${SULLA_SOURCE_DIR}
      dockerfile: services/sulla-vault/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SULLA_VAULT_MODE: server
      SULLA_VAULT_DATABASE_URL: postgresql://sulla:${SULLA_POSTGRES_PASSWORD}@postgres:5432/sulla
      SULLA_VAULT_JWT_SECRET: ${SULLA_VAULT_JWT_SECRET}
      SULLA_VAULT_SERVER_BOOTSTRAP_TOKEN: ${SULLA_VAULT_SERVER_BOOTSTRAP_TOKEN}
      SULLA_VAULT_HUMAN_UI_ORIGIN: ${SULLA_PUBLIC_URL}
      SULLA_VAULT_TLS_CERTIFICATE_PATH: ""
      SULLA_VAULT_TLS_PRIVATE_KEY_PATH: ""
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
  files:
    image: sulla-files:${SULLA_IMAGE_TAG}
    build:
      context: ${SULLA_SOURCE_DIR}
      dockerfile: services/sulla-files/Dockerfile
    restart: unless-stopped
    depends_on:
      files-db-init: { condition: service_completed_successfully }
      vault: { condition: service_healthy }
    environment:
      SULLA_FILES_MODE: server
      SULLA_FILES_DATABASE_URL: postgresql://sulla:${SULLA_POSTGRES_PASSWORD}@postgres:5432/sulla_files
      SULLA_FILES_VAULT_DATABASE_URL: postgresql://sulla:${SULLA_POSTGRES_PASSWORD}@postgres:5432/sulla
      SULLA_FILES_CAPABILITY_SIGNING_KEY: ${SULLA_FILES_CAPABILITY_SIGNING_KEY}
      SULLA_FILES_JWT_SECRET: ${SULLA_VAULT_JWT_SECRET}
      SULLA_FILES_BACKUP_TARGET: /backup
    volumes:
      - ${SULLA_DATA_DIR}/files:/var/lib/sulla-files
      - ${SULLA_DATA_DIR}/files-backup:/backup
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8792/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
  files-db-init:
    image: postgres:16.14-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${SULLA_POSTGRES_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        if [ "$(psql -h postgres -U sulla -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='sulla_files'")" != 1 ]; then
        createdb -h postgres -U sulla -O sulla sulla_files; fi
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      vault: { condition: service_healthy }
      files: { condition: service_healthy }
    environment:
      SULLA_TLS_CERT_CONTAINER_PATH: ${SULLA_TLS_CERT_CONTAINER_PATH:-}
      SULLA_TLS_KEY_CONTAINER_PATH: ${SULLA_TLS_KEY_CONTAINER_PATH:-}
    entrypoint: ["/etc/sulla/entrypoint.sh"]
    ports:
      - "${SULLA_BIND_ADDRESS}:${SULLA_PORT}:8787"
    volumes:
      - ${SULLA_SOURCE_DIR}/deploy/server/gateway/nginx.conf.template:/etc/sulla/nginx.conf.template:ro
      - ${SULLA_SOURCE_DIR}/deploy/server/gateway/entrypoint.sh:/etc/sulla/entrypoint.sh:ro
      - ${SULLA_TLS_DIR}:/run/sulla-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$SULLA_TLS_CERT_CONTAINER_PATH\" ]; then wget --no-check-certificate -qO- https://127.0.0.1:8787/healthz; else wget -qO- http://127.0.0.1:8787/healthz; fi"]
      interval: 5s
      timeout: 3s
      retries: 30
