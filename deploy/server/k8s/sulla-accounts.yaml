apiVersion: apps/v1
kind: Deployment
metadata: {name: sulla-accounts, namespace: sulla}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sulla-accounts}}
  template:
    metadata: {labels: {app: sulla-accounts}}
    spec:
      containers:
        - name: accounts
          image: __SULLA_ACCOUNTS_IMAGE__
          ports: [{name: http, containerPort: 3020}, {name: keycloak, containerPort: 8080}]
          env:
            - {name: SULLA_ACCOUNTS_MODE, value: server}
            - {name: SULLA_ACCOUNTS_PORT, value: "3020"}
            - {name: SULLA_ACCOUNTS_DATABASE_HOST, value: postgres}
            - {name: SULLA_ACCOUNTS_DATABASE_NAME, value: sulla_accounts}
            - {name: SULLA_ACCOUNTS_DATABASE_USERNAME_FILE, value: /run/sulla-secrets/postgres-username}
            - {name: SULLA_ACCOUNTS_DATABASE_PASSWORD_FILE, value: /run/sulla-secrets/postgres-password}
            - {name: SULLA_ACCOUNTS_SESSION_SECRET_SOURCE_FILE, value: /run/sulla-secrets/accounts-session}
            - {name: SULLA_ACCOUNTS_ENCRYPTION_KEY_SOURCE_FILE, value: /run/sulla-secrets/accounts-encryption}
            - {name: SULLA_ACCOUNTS_ADMIN_SECRET_SOURCE_FILE, value: /run/sulla-secrets/accounts-admin}
            - {name: SULLA_ACCOUNTS_SERVICE_TOKENS_SOURCE_FILE, value: /run/sulla-secrets/accounts-service-tokens}
            - {name: SULLA_ACCOUNTS_PUBLIC_URL, value: __SULLA_PUBLIC_URL__}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_ISSUER, value: __SULLA_PUBLIC_URL__/auth/realms/sulla}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_AUTHORITY_ID, value: __SULLA_ACCOUNTS_AUTHORITY_ID__}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_NATIVE_CLIENT_ID, value: sulla-desktop}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_WEB_CLIENT_ID, value: sulla-web}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_WEB_REDIRECT_URIS, value: __SULLA_ACCOUNTS_REDIRECT_URIS__}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_MEMBERSHIP_AUDIENCE, value: sulla-membership}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_RESOURCE_AUDIENCES, value: sulla-accounts,sulla-console,sulla-vault,sulla-files,sulla-agents,sulla-workflows}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_DATABASE_URL, value: jdbc:postgresql://postgres:5432/keycloak}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_DATABASE_USERNAME_FILE, value: /run/sulla-secrets/postgres-username}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_DATABASE_PASSWORD_FILE, value: /run/sulla-secrets/postgres-password}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_ADMIN_USERNAME_FILE, value: /run/sulla-secrets/keycloak-admin-username}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_ADMIN_PASSWORD_FILE, value: /run/sulla-secrets/keycloak-admin-password}
            - {name: SULLA_ACCOUNTS_KEYCLOAK_WEB_CLIENT_SECRET_FILE, value: /run/sulla-secrets/keycloak-web-client-secret}
            - {name: SULLA_ACCOUNTS_TRUSTED_PROXY, value: "1"}
          volumeMounts: [{name: secrets, mountPath: /run/sulla-secrets, readOnly: true}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 15, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
      volumes: [{name: secrets, secret: {secretName: sulla-server, defaultMode: 0600}}]
---
apiVersion: v1
kind: Service
metadata: {name: sulla-accounts, namespace: sulla}
spec:
  selector: {app: sulla-accounts}
  ports: [{name: http, port: 3020, targetPort: http}, {name: keycloak, port: 8080, targetPort: keycloak}]
