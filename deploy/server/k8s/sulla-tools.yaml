apiVersion: apps/v1
kind: Deployment
metadata: {name: sulla-tools, namespace: sulla}
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-tools}}
  template:
    metadata: {labels: {app: sulla-tools}}
    spec:
      containers:
        - name: tools
          image: __SULLA_TOOLS_IMAGE__
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: PORT, value: "3000"}
            - {name: SULLA_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: tools-database-url}}}
            - {name: SULLA_REDIS_URL, value: redis://redis:6379}
            - {name: SULLA_API_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: agent-api-token}}}
            - {name: SULLA_DESKTOP_EXECUTOR_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: desktop-executor-url}}}
            - {name: SULLA_DESKTOP_EXECUTOR_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: desktop-executor-token}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-tools, namespace: sulla}
spec: {selector: {app: sulla-tools}, ports: [{name: http, port: 3000, targetPort: http}]}
