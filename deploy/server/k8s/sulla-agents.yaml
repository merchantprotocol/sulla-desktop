apiVersion: apps/v1
kind: Deployment
metadata: {name: sulla-agents, namespace: sulla}
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-agents}}
  template:
    metadata: {labels: {app: sulla-agents}}
    spec:
      containers:
        - name: agents
          image: __SULLA_AGENTS_IMAGE__
          securityContext: {runAsUser: 0}
          ports: [{name: http, containerPort: 8789}]
          env:
            - {name: SULLA_AGENT_SERVICE_MODE, value: server}
            - {name: SULLA_AGENT_SERVICE_PORT, value: "8789"}
            - {name: SULLA_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: agents-database-url}}}
            - {name: SULLA_API_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: agent-api-token}}}
            - {name: SULLA_TOOL_API_URL, value: http://sulla-tools:3000}
            - {name: SULLA_DOCKER_NETWORK, value: sulla_default}
            - {name: SULLA_ACCOUNTS_URL, value: http://sulla-accounts:3020}
            - {name: SULLA_ACCOUNTS_SERVICE_ID, value: sulla-agents}
            - {name: SULLA_ACCOUNTS_SERVICE_TOKEN_FILE, value: /run/sulla-secrets/accounts-agents-token}
            - {name: SULLA_AGENT_AUDIENCE, value: sulla-agents}
          volumeMounts: [{name: secrets, mountPath: /run/sulla-secrets, readOnly: true}, {name: docker, mountPath: /var/run/docker.sock}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
      volumes:
        - {name: secrets, secret: {secretName: sulla-server, defaultMode: 0600}}
        - {name: docker, hostPath: {path: /var/run/docker.sock, type: Socket}}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-agents, namespace: sulla}
spec: {selector: {app: sulla-agents}, ports: [{name: http, port: 8789, targetPort: http}]}
