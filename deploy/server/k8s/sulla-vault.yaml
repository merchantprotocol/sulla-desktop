apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-vault
  namespace: sulla
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-vault}}
  template:
    metadata: {labels: {app: sulla-vault}}
    spec:
      containers:
        - name: vault
          image: __SULLA_VAULT_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8787}]
          env:
            - {name: SULLA_VAULT_MODE, value: server}
            # Override Kubernetes' legacy service-link variable for the
            # identically named sulla-vault Service (tcp://... is not a port).
            - {name: SULLA_VAULT_PORT, value: "8787"}
            - {name: SULLA_VAULT_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: database-url}}}
            - {name: SULLA_VAULT_JWT_SECRET, valueFrom: {secretKeyRef: {name: sulla-server, key: jwt-secret}}}
            - {name: SULLA_VAULT_SERVER_BOOTSTRAP_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: bootstrap-token}}}
            - {name: SULLA_VAULT_ACCOUNTS_URL, value: http://sulla-accounts:3020}
            - {name: SULLA_VAULT_ACCOUNTS_SERVICE_ID, value: vault}
            - {name: SULLA_VAULT_ACCOUNTS_SERVICE_TOKEN_FILE, value: /run/sulla-secrets/accounts-vault-token}
            - {name: SULLA_VAULT_ACCOUNTS_AUDIENCE, value: sulla-vault}
            - {name: SULLA_VAULT_ACCOUNTS_REQUIRED_ROLES, value: member}
            - {name: SULLA_PUBLIC_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: public-url}}}
            - {name: SULLA_VAULT_BROWSER_HOST, valueFrom: {secretKeyRef: {name: sulla-server, key: vault-host}}}
            - {name: SULLA_VAULT_BROWSER_ORIGIN, valueFrom: {secretKeyRef: {name: sulla-server, key: vault-url}}}
            - {name: SULLA_VAULT_PROVIDERS_RECIPIENT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: sulla-server, key: agents-broker-public-key}}}
            - {name: SULLA_VAULT_PROVIDERS_SERVICE_ID, value: sulla-agents}
            - {name: SULLA_VAULT_PROVIDERS_SERVICE_TOKEN_FILE, value: /run/sulla-secrets/vault-providers-token}
          volumeMounts: [{name: secrets, mountPath: /run/sulla-secrets, readOnly: true}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
      volumes: [{name: secrets, secret: {secretName: sulla-server, defaultMode: 0600}}]
---
apiVersion: v1
kind: Service
metadata: {name: sulla-vault, namespace: sulla}
spec:
  selector: {app: sulla-vault}
  ports: [{name: http, port: 8787, targetPort: http}]
