apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-vault
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-vault}}
  template:
    metadata: {labels: {app: sulla-vault}}
    spec:
      containers:
        - name: vault
          image: __SULLA_VAULT_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8787}]
          env:
            - {name: SULLA_VAULT_MODE, value: server}
            - {name: SULLA_VAULT_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: database-url}}}
            - {name: SULLA_VAULT_JWT_SECRET, valueFrom: {secretKeyRef: {name: sulla-server, key: jwt-secret}}}
            - {name: SULLA_VAULT_SERVER_BOOTSTRAP_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: bootstrap-token}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-vault}
spec:
  selector: {app: sulla-vault}
  ports: [{name: http, port: 8787, targetPort: http}]
