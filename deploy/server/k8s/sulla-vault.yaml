apiVersion: v1
kind: Secret
metadata:
  name: sulla-vault
type: Opaque
stringData:
  database-url: postgresql://sulla_vault:change-me@sulla-postgres:5432/sulla_vault
  jwt-secret: change-me-to-a-random-32-character-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-vault
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-vault}}
  template:
    metadata: {labels: {app: sulla-vault}}
    spec:
      containers:
        - name: vault
          image: ghcr.io/merchantprotocol/sulla-vault:latest
          ports: [{name: http, containerPort: 8787}]
          env:
            - {name: SULLA_VAULT_MODE, value: server}
            - {name: SULLA_VAULT_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-vault, key: database-url}}}
            - {name: SULLA_VAULT_JWT_SECRET, valueFrom: {secretKeyRef: {name: sulla-vault, key: jwt-secret}}}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-vault}
spec:
  selector: {app: sulla-vault}
  ports: [{name: http, port: 8787, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: sulla-vault}
spec:
  tls: [{hosts: [vault.example.com], secretName: sulla-vault-tls}]
  rules:
    - host: vault.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: sulla-vault, port: {name: http}}}}]}
