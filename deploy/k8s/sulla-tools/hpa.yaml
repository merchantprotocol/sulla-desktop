apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sulla-tools
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sulla-tools }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
