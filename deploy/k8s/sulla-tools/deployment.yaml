apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-tools
  labels: { app.kubernetes.io/name: sulla-tools }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: sulla-tools }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sulla-tools }
    spec:
      containers:
        - name: sulla-tools
          image: ghcr.io/merchantprotocol/sulla-tools:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: SULLA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: database-url } }
            - name: SULLA_REDIS_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: redis-url } }
            - name: SULLA_CAPABILITY_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: sulla-tools, key: capability-signing-key } }
            - name: SULLA_DESKTOP_EXECUTOR_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: desktop-executor-url, optional: true } }
            - name: SULLA_DESKTOP_EXECUTOR_TOKEN
              valueFrom: { secretKeyRef: { name: sulla-tools, key: desktop-executor-token, optional: true } }
            - name: SULLA_AGENT_KEY_FILE
              value: /run/secrets/sulla-agent-key
            - name: SULLA_RELAY_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: relay-url, optional: true } }
            - name: SULLA_RELAY_TOKEN
              valueFrom: { secretKeyRef: { name: sulla-tools, key: relay-token, optional: true } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: agent-key
              mountPath: /run/secrets/sulla-agent-key
              subPath: agent-key.json
              readOnly: true
      volumes:
        - name: agent-key
          secret:
            secretName: sulla-tools-agent-key
            items:
              - { key: agent-key.json, path: agent-key.json, mode: 256 }
