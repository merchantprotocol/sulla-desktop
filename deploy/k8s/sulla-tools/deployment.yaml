apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-tools
  labels: { app.kubernetes.io/name: sulla-tools }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: sulla-tools }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sulla-tools }
    spec:
      containers:
        - name: sulla-tools
          image: ghcr.io/merchantprotocol/sulla-tools:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: SULLA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: database-url } }
            - name: SULLA_REDIS_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: redis-url } }
            - name: SULLA_CAPABILITY_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: sulla-tools, key: capability-signing-key } }
            - name: SULLA_DESKTOP_EXECUTOR_URL
              valueFrom: { secretKeyRef: { name: sulla-tools, key: desktop-executor-url } }
            - name: SULLA_DESKTOP_EXECUTOR_TOKEN
              valueFrom: { secretKeyRef: { name: sulla-tools, key: desktop-executor-token } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
