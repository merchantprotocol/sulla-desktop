name: Publish sulla-relay image
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['services/sulla-relay/**', 'pkg/sulla-desktop/runtime/relayProtocol.ts', 'pkg/sulla-desktop/runtime/relayTunnelClient.ts', '.github/workflows/sulla-relay-image.yml']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env: {DOCKER_METADATA_SHORT_SHA_LENGTH: 12}
        with:
          images: ghcr.io/merchantprotocol/sulla-relay
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sulla-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
