name: Publish sulla-accounts image
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/sulla-accounts/**'
      - 'contracts/server-split/**'
      - 'scripts/contracts/write-base-image-metadata.mjs'
      - '.github/workflows/sulla-accounts-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ghcr.io/merchantprotocol/sulla-accounts
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sulla-accounts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Write immutable base image metadata
        run: node scripts/contracts/write-base-image-metadata.mjs ghcr.io/merchantprotocol/sulla-accounts ${{ steps.build.outputs.digest }} ${{ github.sha }} sulla-accounts-base-image.json
      - name: Upload immutable base image metadata
        uses: actions/upload-artifact@v4
        with:
          name: sulla-accounts-base-image-${{ github.sha }}
          path: sulla-accounts-base-image.json
          if-no-files-found: error
