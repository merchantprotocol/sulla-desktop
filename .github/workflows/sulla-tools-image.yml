name: Publish sulla-tools image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/sulla-tools/**'
      - 'pkg/rancher-desktop/agent/tools/**'
      - 'pkg/rancher-desktop/agent/database/**'
      - 'pkg/rancher-desktop/runtime/capabilityToken.ts'
      - 'pkg/rancher-desktop/runtime/desktopExecutor.ts'
      - 'pkg/rancher-desktop/runtime/relay*.ts'
      - '.github/workflows/sulla-tools-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/merchantprotocol/sulla-tools
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sulla-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
