# SPDX-License-Identifier: GPL-2.0-or-later
name: Publish sulla-tools image
on:
  pull_request:
    paths:
      - 'services/sulla-tools/**'
      - 'pkg/sulla-desktop/agent/**'
      - 'pkg/sulla-desktop/runtime/**'
      - 'pkg/sulla-desktop/vault-broker/**'
      - 'pkg/sulla-desktop/utils/instance.ts'
      - 'contracts/server-split/**'
      - '.github/workflows/sulla-tools-image.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/sulla-tools/**'
      - 'pkg/sulla-desktop/agent/**'
      - 'pkg/sulla-desktop/runtime/**'
      - 'pkg/sulla-desktop/vault-broker/**'
      - 'contracts/server-split/**'
      - 'scripts/contracts/write-base-image-metadata.mjs'
      - '.github/workflows/sulla-tools-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and import entrypoint dependencies
        run: docker build --file services/sulla-tools/Dockerfile --tag sulla-tools-smoke .
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/merchantprotocol/sulla-tools
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sulla-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Write immutable base image metadata
        run: node scripts/contracts/write-base-image-metadata.mjs ghcr.io/merchantprotocol/sulla-tools ${{ steps.build.outputs.digest }} ${{ github.sha }} sulla-tools-base-image.json
      - name: Upload immutable base image metadata
        uses: actions/upload-artifact@v4
        with:
          name: sulla-tools-base-image-${{ github.sha }}
          path: sulla-tools-base-image.json
          if-no-files-found: error
