# SPDX-License-Identifier: GPL-2.0-or-later
name: Publish sulla-tools image
on:
  pull_request:
    paths:
      - 'services/sulla-tools/**'
      - 'pkg/sulla-desktop/agent/**'
      - 'pkg/sulla-desktop/runtime/**'
      - 'pkg/sulla-desktop/vault-broker/**'
      - 'pkg/sulla-desktop/utils/**'
      - 'contracts/server-split/**'
      - '.github/workflows/sulla-tools-image.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/sulla-tools/**'
      - 'pkg/sulla-desktop/agent/**'
      - 'pkg/sulla-desktop/runtime/**'
      - 'pkg/sulla-desktop/vault-broker/**'
      - 'pkg/sulla-desktop/utils/**'
      - 'contracts/server-split/**'
      - 'scripts/contracts/write-base-image-metadata.mjs'
      - '.github/workflows/sulla-tools-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file services/sulla-tools/Dockerfile --tag sulla-tools-smoke .
      - name: Start the real entrypoint and keep it healthy for 30 seconds
        run: |
          docker network create sulla-tools-smoke
          docker run -d --name postgres --network sulla-tools-smoke \
            -e POSTGRES_USER=sulla -e POSTGRES_PASSWORD=sulla_dev_password -e POSTGRES_DB=sulla postgres:16-alpine
          docker run -d --name redis --network sulla-tools-smoke redis:7-alpine
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U sulla -d sulla && docker exec redis redis-cli ping | grep -q PONG && break
            sleep 1
          done
          docker run -d --name tools --network sulla-tools-smoke \
            -e SULLA_API_TOKEN=0123456789012345678901234567890123456789 \
            sulla-tools-smoke
          for attempt in $(seq 1 30); do
            if docker exec tools wget -q -O- http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'; then break; fi
            test "$(docker inspect --format '{{.State.Running}}' tools)" = true
            sleep 1
          done
          for second in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' tools)" = true
            docker exec tools wget -q -O- http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'
            sleep 1
          done
          docker logs tools
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/merchantprotocol/sulla-tools
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sulla-tools/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Write immutable base image metadata
        run: node scripts/contracts/write-base-image-metadata.mjs ghcr.io/merchantprotocol/sulla-tools ${{ steps.build.outputs.digest }} ${{ github.sha }} sulla-tools-base-image.json
      - name: Upload immutable base image metadata
        uses: actions/upload-artifact@v4
        with:
          name: sulla-tools-base-image-${{ github.sha }}
          path: sulla-tools-base-image.json
          if-no-files-found: error
