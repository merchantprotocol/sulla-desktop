# SPDX-License-Identifier: GPL-2.0-or-later
name: Publish sulla-vault image
on:
  workflow_dispatch:
  # PRs only type-check (job `typecheck`); the image is published after merge.
  pull_request:
    paths:
      - 'services/sulla-vault/**'
      - 'packages/vault-crypto/**'
      - 'packages/vault-profiles/**'
      - '.github/workflows/sulla-vault-image.yml'
  push:
    branches: [main]
    tags: ['v*']
    # Only rebuild when the vault's own inputs change. Every new :latest digest makes
    # Desktop recreate the vault container at launch, which comes back locked.
    paths:
      - 'services/sulla-vault/**'
      - 'packages/vault-crypto/**'
      - 'packages/vault-profiles/**'
      - 'contracts/server-split/**'
      - 'scripts/contracts/write-base-image-metadata.mjs'
      - '.github/workflows/sulla-vault-image.yml'
permissions:
  contents: read
  packages: write
jobs:
  # A vault that does not compile cannot be published, and an unpublished image
  # blocks every local build at `vault-pin-check`. Catch it before merge.
  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build vault-crypto
        run: cd packages/vault-crypto && npm ci --ignore-scripts && npm run build
      - name: Build sulla-vault (same steps as the Dockerfile)
        run: cd services/sulla-vault && npm install --ignore-scripts && npm run build
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ghcr.io/merchantprotocol/sulla-vault
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sulla-vault/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Write immutable base image metadata
        run: node scripts/contracts/write-base-image-metadata.mjs ghcr.io/merchantprotocol/sulla-vault ${{ steps.build.outputs.digest }} ${{ github.sha }} sulla-vault-base-image.json
      - name: Upload immutable base image metadata
        uses: actions/upload-artifact@v4
        with:
          name: sulla-vault-base-image-${{ github.sha }}
          path: sulla-vault-base-image.json
          if-no-files-found: error
