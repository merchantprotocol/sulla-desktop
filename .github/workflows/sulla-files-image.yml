name: Publish sulla-files image
on:
  pull_request:
    paths: ['services/sulla-files/**', 'pkg/sulla-desktop/pages/files/**', 'packages/vault-crypto/**', '.github/workflows/sulla-files-image.yml']
  push:
    branches: [main]
    tags: ['v*']
    paths: ['services/sulla-files/**', 'pkg/sulla-desktop/pages/files/**', 'packages/vault-crypto/**', '.github/workflows/sulla-files-image.yml']
permissions: { contents: read, packages: write }
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --prefix packages/vault-crypto
      - run: npm run build --prefix packages/vault-crypto
      - run: npm ci --ignore-scripts --prefix services/sulla-files
      - run: npm run build --prefix services/sulla-files
      - run: node --test services/sulla-files/dist/cloudSync/sync.security.test.js
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ghcr.io/merchantprotocol/sulla-files
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with: { context: ., file: services/sulla-files/Dockerfile, platforms: 'linux/amd64,linux/arm64', push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}' }
      - name: Write immutable base image metadata
        run: node scripts/contracts/write-base-image-metadata.mjs ghcr.io/merchantprotocol/sulla-files ${{ steps.build.outputs.digest }} ${{ github.sha }} sulla-files-base-image.json
      - name: Upload immutable base image metadata
        uses: actions/upload-artifact@v4
        with:
          name: sulla-files-base-image-${{ github.sha }}
          path: sulla-files-base-image.json
          if-no-files-found: error
