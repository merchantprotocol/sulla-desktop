# SPDX-License-Identifier: GPL-2.0-or-later
name: Account auth v1
on:
  pull_request:
    paths:
      - '.github/workflows/account-auth-v1.yml'
      - 'packages/vault-crypto/**'
      - 'pkg/sulla-desktop/main/sullaCloudAuth.ts'
  push:
    branches: [main]
    paths:
      - 'packages/vault-crypto/**'
      - 'pkg/sulla-desktop/main/sullaCloudAuth.ts'
permissions:
  contents: read
jobs:
  known-answer:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/vault-crypto
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: packages/vault-crypto/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build and run vault crypto security tests
        run: npm run test:security
