name: architecture-guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch PR base (allowlist may only shrink)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - name: Bundled sulla-tools parity
        run: node scripts/check-bundled-tools-parity.mjs
      - name: Bundled sulla-tools parity tests
        run: node --test scripts/check-bundled-tools-parity.test.mjs
      - name: Architecture guard
        env:
          GUARD_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/architecture-guard/guard.mjs
