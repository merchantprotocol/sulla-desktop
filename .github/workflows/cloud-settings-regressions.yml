name: Cloud settings regressions
on:
  pull_request:
    paths:
      - '.github/workflows/cloud-settings-regressions.yml'
      - 'pkg/sulla-desktop/main/cloud/cloudConsentInit.ts'
      - 'pkg/sulla-desktop/main/cloud/__tests__/cloudConsentInit.spec.ts'
  push:
    branches: [main]
    paths:
      - 'pkg/sulla-desktop/main/cloud/cloudConsentInit.ts'
      - 'pkg/sulla-desktop/main/cloud/__tests__/cloudConsentInit.spec.ts'
permissions:
  contents: read
jobs:
  focused-cloud-settings:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: package.json
      # cloudConsentInit is dependency-free by design: no install, no config, just Node.
      - name: Run focused cloud consent-init tests
        run: node --experimental-strip-types --test pkg/sulla-desktop/main/cloud/__tests__/cloudConsentInit.spec.ts
