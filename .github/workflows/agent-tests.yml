# SPDX-License-Identifier: GPL-2.0-or-later
# Agent-runtime specs (OOP rebuild plan §11): real collaborators, real Postgres.
name: agent-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `typecheck` semantically type-checks three entry graphs (agent runtime,
  # main/preload, renderer) with real `tsc` diagnostics, not `--noCheck`
  # syntax parsing. ubuntu-latest gives this public repo a 16 GB runner, so
  # each graph gets a 12 GB heap (NODE_OPTIONS=--max-old-space-size=12288).
  # A graph with pre-existing errors on main is still checked, not skipped:
  # .github/scripts/typecheck-gate.mjs diffs that step's tsc output against
  # .github/typecheck-baseline/<graph>.txt and fails only on errors NOT
  # already in the baseline. To accept new pre-existing errors on purpose
  # (e.g. widening a graph's include set), regenerate that graph's baseline
  # with: node .github/scripts/typecheck-gate.mjs --project <tsconfig>
  # --baseline .github/typecheck-baseline/<graph>.txt --write-baseline --
  # --incremental --tsBuildInfoFile .cache/typescript/<graph>.tsbuildinfo
  # then commit the rewritten baseline file. Runs in parallel with
  # `agent-tests`, which stays the job that actually runs the specs.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
      - name: Install dependencies (no lifecycle scripts, no Electron download)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Restore incremental typecheck state
        uses: actions/cache@v4
        with:
          path: .cache/typescript
          key: typecheck-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'pkg/sulla-desktop/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'pkg/sulla-desktop/tsconfig.json') }}-
      - name: Type-check agent runtime graph
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.agent-runtime-check.json
          --baseline .github/typecheck-baseline/agent.txt
          --
          --incremental --tsBuildInfoFile .cache/typescript/agent.tsbuildinfo
      - name: Type-check main and preload production graphs
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.typecheck.json
          --baseline .github/typecheck-baseline/main.txt
          --
          --incremental --tsBuildInfoFile .cache/typescript/main.tsbuildinfo
      - name: Type-check renderer production graphs
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.renderer-check.json
          --baseline .github/typecheck-baseline/renderer.txt
          --
          --incremental --tsBuildInfoFile .cache/typescript/renderer.tsbuildinfo

  agent-tests:
    name: agent-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: sulla
          POSTGRES_PASSWORD: sulla-ci
          POSTGRES_DB: sulla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sulla -d sulla_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SULLA_TEST_DATABASE_URL: postgres://sulla:sulla-ci@127.0.0.1:5432/sulla_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
      - name: Install dependencies (no lifecycle scripts, no Electron download)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Install BusyBox for guest disk characterization
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Per-PR agent runtime specs (hard 60-second test budget)
        if: github.event_name == 'pull_request'
        env:
          TEST_PR_BASE_REF: origin/${{ github.base_ref }}
        run: yarn test:pr
      - name: Full agent runtime specs on main
        if: github.event_name != 'pull_request'
        run: yarn test:agent
