# SPDX-License-Identifier: GPL-2.0-or-later
# Agent-runtime specs (OOP rebuild plan §11): real collaborators, real Postgres.
name: agent-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      write_baseline:
        description: >-
          Regenerate .github/typecheck-baseline/{agent,main,renderer}.txt
          from this ref's actual tsc output and commit them back to this
          branch, instead of gating. Use after merging main into a branch
          whose typecheck job needs fresh "pre-existing on main" baselines.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `typecheck` semantically type-checks three entry graphs (agent runtime,
  # main/preload, renderer) with real `tsc` diagnostics, not `--noCheck`
  # syntax parsing. ubuntu-latest gives this public repo a 16 GB runner, so
  # each graph gets a 12 GB heap (NODE_OPTIONS=--max-old-space-size=12288).
  # A graph with pre-existing errors on main is still checked, not skipped:
  # .github/scripts/typecheck-gate.mjs diffs that step's tsc output against
  # .github/typecheck-baseline/<graph>.txt and fails only on errors NOT
  # already in the baseline. A baseline entry is a count per (file, TS
  # code, normalized message) fingerprint, not a line number, so an
  # unrelated edit that shifts an existing error's line doesn't trip the
  # gate; see .github/scripts/typecheck-gate.mjs for the fingerprint
  # rules. To refresh a branch's baselines after accepting new
  # pre-existing errors on purpose (e.g. merging main, or widening a
  # graph's include set), run this workflow via "Run workflow" on that
  # branch with write_baseline: true — it regenerates all three files
  # from that ref's real tsc output and commits them back automatically.
  # Equivalent by hand: node .github/scripts/typecheck-gate.mjs --project
  # <tsconfig> --baseline .github/typecheck-baseline/<graph>.txt
  # --write-baseline -- --incremental
  # --tsBuildInfoFile .cache/typescript/<graph>.tsbuildinfo, then commit
  # the rewritten file. Runs in parallel with `agent-tests`, which stays
  # the job that actually runs the specs.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # write access is only exercised by the write-baseline steps below,
    # which are themselves gated on workflow_dispatch + write_baseline=true.
    # A pull_request-triggered run never reaches them.
    permissions:
      contents: write
    env:
      WRITE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.write_baseline && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
      - name: Install dependencies (no lifecycle scripts, no Electron download)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Restore incremental typecheck state
        uses: actions/cache@v4
        with:
          path: .cache/typescript
          key: typecheck-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'pkg/sulla-desktop/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'pkg/sulla-desktop/tsconfig.json') }}-
      - name: Type-check agent runtime graph
        if: env.WRITE_BASELINE == 'false'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.agent-runtime-check.json
          --baseline .github/typecheck-baseline/agent.txt
          --
          --incremental --tsBuildInfoFile .cache/typescript/agent.tsbuildinfo
      - name: Type-check main and preload production graphs
        if: env.WRITE_BASELINE == 'false'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.typecheck.json
          --baseline .github/typecheck-baseline/main.txt
          --
          --incremental --tsBuildInfoFile .cache/typescript/main.tsbuildinfo
      - name: Type-check renderer production graphs
        if: env.WRITE_BASELINE == 'false'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.renderer-check.json
          --baseline .github/typecheck-baseline/renderer.txt
          --
          --incremental --tsBuildInfoFile .cache/typescript/renderer.tsbuildinfo
      - name: Compile production agent bundle
        if: env.WRITE_BASELINE == 'false'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: node scripts/ts-wrapper.js scripts/check-agent-production-bundle.ts
      - name: Regenerate agent runtime baseline
        if: env.WRITE_BASELINE == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.agent-runtime-check.json
          --baseline .github/typecheck-baseline/agent.txt
          --write-baseline
          --
          --incremental --tsBuildInfoFile .cache/typescript/agent.tsbuildinfo
      - name: Regenerate main and preload baseline
        if: env.WRITE_BASELINE == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.typecheck.json
          --baseline .github/typecheck-baseline/main.txt
          --write-baseline
          --
          --incremental --tsBuildInfoFile .cache/typescript/main.tsbuildinfo
      - name: Regenerate renderer baseline
        if: env.WRITE_BASELINE == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: >-
          node .github/scripts/typecheck-gate.mjs
          --project tsconfig.renderer-check.json
          --baseline .github/typecheck-baseline/renderer.txt
          --write-baseline
          --
          --incremental --tsBuildInfoFile .cache/typescript/renderer.tsbuildinfo
      - name: Commit regenerated baselines
        if: env.WRITE_BASELINE == 'true'
        run: |
          git config user.name "sulla-ci[bot]"
          git config user.email "sulla-ci[bot]@users.noreply.github.com"
          git add .github/typecheck-baseline/agent.txt .github/typecheck-baseline/main.txt .github/typecheck-baseline/renderer.txt
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "ci: regenerate typecheck baselines from $(git rev-parse --short HEAD)"
            git push origin HEAD:${{ github.ref_name }}
          fi

  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.classify.outputs.should_run }}
      needs_busybox: ${{ steps.classify.outputs.needs_busybox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          TEST_PR_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: node scripts/agent-test-ci-gate.mjs
      - name: Selection unit tests
        run: node --test scripts/agent-test-selection.test.mjs
      - name: Architecture guard
        run: node scripts/architecture-guard/guard.mjs

  # Per-PR run: a hard 60-second test budget (enforced inside scripts/test-pr.mjs
  # itself, which exits 124 on overrun). timeout-minutes here is deliberately
  # larger than that budget — it only has to cover checkout, Node setup and the
  # dependency install, which is a guaranteed cache miss on every run because
  # Actions caches are disabled for this repo, plus Postgres container startup.
  # Named "agent-tests" (not "agent-tests-pr") deliberately: branch protection's
  # required status check targets this exact job name on pull_request events.
  agent-tests:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: sulla
          POSTGRES_PASSWORD: sulla-ci
          POSTGRES_DB: sulla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sulla -d sulla_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      SULLA_TEST_DATABASE_URL: postgres://sulla:sulla-ci@127.0.0.1:5432/sulla_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
      - name: Restore exact dependency tree
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: agent-tests-${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Install BusyBox for guest disk characterization
        if: needs.changes.outputs.needs_busybox == 'true'
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Check whether CE-1 renderer smoke is affected
        id: ce1
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -Eq '^(pkg/sulla-desktop/pages/CaptureStudio.vue|pkg/sulla-desktop/pages/capture-studio/|resources/camera-effects/|scripts/camera-effects-smoke)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Electron binary for focused offline CE-1 smoke
        if: steps.ce1.outputs.run == 'true'
        run: node node_modules/electron/install.js
      - name: Prove CE-1 pixel regression rejects prior scaled overscan
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 1
        run: |
          if CE1_REGRESSION_MUTANT=1 xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs > /tmp/ce1-mutant.log 2>&1; then
            cat /tmp/ce1-mutant.log
            echo 'Regression did not reject scaled overscan'
            exit 1
          fi
          cat /tmp/ce1-mutant.log
          # Either the blur edge/opacity guards or the coordinate sentinel may reject it.
          grep -Eq 'Scene coordinates changed|Transparent blur edge|High contrast background moved' /tmp/ce1-mutant.log
      - name: Prove CE-1 pixel regression rejects a shifted auto-frame crop
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 1
        run: |
          if CE1_CROP_MUTANT=1 xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs > /tmp/ce1-crop-mutant.log 2>&1; then
            cat /tmp/ce1-crop-mutant.log
            echo 'Regression did not reject shifted crop'
            exit 1
          fi
          cat /tmp/ce1-crop-mutant.log
          # The shifted crop also applies at autoFrame:false, so the first pixel guard to see it may be any of these.
          grep -Eq 'Framed foreground/background coordinates changed|Crop/source coordinate mismatch|Scene coordinates changed|High contrast background moved' /tmp/ce1-crop-mutant.log
      - name: Real offline CE-1 renderer inference and pixel regression
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 2
        run: xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs
      - name: Prove mounted preview rejects primary and assignment regressions
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 3
        run: |
          for kind in PREVIEW ASSIGNMENT; do
            if env CE1_${kind}_MUTANT=1 xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs > /tmp/ce1-preview-mutant.log 2>&1; then
              cat /tmp/ce1-preview-mutant.log
              echo "Mounted preview did not reject $kind regression"
              exit 1
            fi
            cat /tmp/ce1-preview-mutant.log
            if [ "$kind" = PREVIEW ]; then
              grep -q 'PREVIEW_PRIMARY_SENTINEL:' /tmp/ce1-preview-mutant.log
            else
              grep -q 'ASSIGNMENT_SENTINEL:' /tmp/ce1-preview-mutant.log
            fi
          done
      - name: Prove CE-1 production menu regression rejects unreachable controls
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          if CE1_MENU_MUTANT=1 xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs > /tmp/ce1-menu-mutant.log 2>&1; then
            cat /tmp/ce1-menu-mutant.log
            echo "Menu regression was not rejected"
            exit 1
          fi
          cat /tmp/ce1-menu-mutant.log
          grep -q 'MENU_REACHABILITY_SENTINEL:' /tmp/ce1-menu-mutant.log
      - name: Prove CE-1 saved-video check rejects raw recording
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          if CE1_RECORDING_MUTANT=1 xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs > /tmp/ce1-recording-mutant.log 2>&1; then
            cat /tmp/ce1-recording-mutant.log
            echo 'Regression did not reject raw recording'
            exit 1
          fi
          cat /tmp/ce1-recording-mutant.log
          grep -q 'RAW_LEAK_SENTINEL:' /tmp/ce1-recording-mutant.log
      - name: Prove CE-1 source startup regression rejects untracked acquisition
        if: steps.ce1.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          if CE1_STARTUP_MUTANT=1 xvfb-run -a node_modules/.bin/electron --no-sandbox --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader scripts/camera-effects-smoke.cjs > /tmp/ce1-startup-mutant.log 2>&1; then
            cat /tmp/ce1-startup-mutant.log
            echo 'Regression did not reject untracked startup'
            exit 1
          fi
          cat /tmp/ce1-startup-mutant.log
          grep -q 'Shutdown skipped pending actual source startup' /tmp/ce1-startup-mutant.log
      - name: Per-PR agent runtime specs (hard 60-second test budget)
        env:
          TEST_PR_BASE_REF: origin/${{ github.base_ref }}
        run: yarn test:pr

  # Full run on push to main (and manual dispatch): yarn test:agent runs the
  # whole agent-runtime suite, measured at 89-123s on #1959/#1964/#1968, plus
  # the same guaranteed cache-miss install and Postgres startup as the PR job.
  # The guest-disk characterization spec always runs here, so BusyBox is
  # always installed, independent of the changed-file classification.
  agent-tests-full:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: sulla
          POSTGRES_PASSWORD: sulla-ci
          POSTGRES_DB: sulla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sulla -d sulla_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      SULLA_TEST_DATABASE_URL: postgres://sulla:sulla-ci@127.0.0.1:5432/sulla_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: yarn
      - name: Restore exact dependency tree
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: agent-tests-${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Install BusyBox for guest disk characterization
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y busybox
      - name: Full agent runtime specs on main
        run: yarn test:agent
