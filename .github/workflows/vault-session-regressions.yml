name: Vault session regressions
on:
  pull_request:
    paths:
      - '.github/workflows/vault-session-regressions.yml'
      - 'pkg/sulla-desktop/agent/services/VaultKeyService.ts'
      - 'pkg/sulla-desktop/agent/services/__tests__/VaultKeyService.session.test.ts'
      - 'pkg/sulla-desktop/main/cloudRelayTransport.ts'
      - 'pkg/sulla-desktop/main/desktopRelay.ts'
      - 'pkg/sulla-desktop/main/__tests__/desktopRelayVault.spec.ts'
      - 'pkg/sulla-desktop/main/sullaCloudAuth.ts'
      - 'packages/vault-crypto/**'
      - 'services/sulla-vault/src/browserEnvelope/**'
      - 'services/sulla-vault/src/filesCloudEscrow.ts'
      - 'services/sulla-vault/src/filesCloudEscrow.security.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vault-session-regressions.yml'
      - 'pkg/sulla-desktop/agent/services/VaultKeyService.ts'
      - 'pkg/sulla-desktop/agent/services/__tests__/VaultKeyService.session.test.ts'
      - 'pkg/sulla-desktop/main/cloudRelayTransport.ts'
      - 'pkg/sulla-desktop/main/desktopRelay.ts'
      - 'pkg/sulla-desktop/main/__tests__/desktopRelayVault.spec.ts'
      - 'pkg/sulla-desktop/main/sullaCloudAuth.ts'
      - 'packages/vault-crypto/**'
      - 'services/sulla-vault/src/browserEnvelope/**'
      - 'services/sulla-vault/src/filesCloudEscrow.ts'
      - 'services/sulla-vault/src/filesCloudEscrow.security.test.ts'
permissions:
  contents: read
jobs:
  focused-vault-session:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: package.json
          cache: yarn
      - name: Use Yarn 1.22.22
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --ignore-platform --ignore-scripts
      - name: Run focused Desktop session and relay restore tests
        run: |
          yarn test:unit:jest --runInBand \
            pkg/sulla-desktop/agent/services/__tests__/VaultKeyService.session.test.ts \
            pkg/sulla-desktop/main/__tests__/desktopRelayVault.spec.ts
      - name: Run focused Files Cloud escrow restore tests
        run: |
          yarn esbuild services/sulla-vault/src/filesCloudEscrow.security.test.ts \
            --bundle --external:libsodium-wrappers-sumo --platform=node --format=esm \
            --outfile=services/sulla-vault/dist-test/filesCloudEscrow.security.test.js
          node --test services/sulla-vault/dist-test/filesCloudEscrow.security.test.js
      - name: Run existing vault envelope tests
        run: |
          yarn esbuild services/sulla-vault/src/browserEnvelope/envelope.security.test.ts \
            --bundle --external:libsodium-wrappers-sumo --platform=node --format=esm \
            --outfile=services/sulla-vault/dist-test/browserEnvelope/envelope.security.test.js
          node --test services/sulla-vault/dist-test/browserEnvelope/envelope.security.test.js
