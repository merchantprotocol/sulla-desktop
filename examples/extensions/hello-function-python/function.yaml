apiVersion: sulla/v1
kind: Function
id: function-hello-function-python
slug: hello-function-python
name: Hello function (Python)
description: Returns a friendly greeting.
schemaversion: 1
spec:
  runtime: python
  entrypoint: main.py::handler
  inputs:
    name:
      type: string
      description: Name to greet.
      default: world
      required: false
  outputs:
    result:
      type: string
      description: Greeting text.
  timeout: 60s
  permissions:
    network: []
