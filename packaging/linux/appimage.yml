app: sulla-desktop

build:
  packages:
    - unzip
    - ImageMagick
    - libcairo2

script:
  - rm -rf $BUILD_APPDIR/* && mkdir -p $BUILD_APPDIR/opt/sulla-desktop $BUILD_APPDIR/usr/share/metainfo $BUILD_APPDIR/usr/bin $BUILD_APPDIR/usr/lib64
  - unzip $BUILD_SOURCE_DIR/sulla-desktop.zip -d $BUILD_APPDIR/opt/sulla-desktop
  - chmod 04755 $BUILD_APPDIR/opt/sulla-desktop/chrome-sandbox
  - mv $BUILD_APPDIR/opt/sulla-desktop/resources/resources/linux/sulla-desktop.desktop $BUILD_APPDIR
  - convert -resize 512x512 $BUILD_APPDIR/opt/sulla-desktop/resources/resources/icons/logo-square-512.png $BUILD_APPDIR/sulla-desktop.png
  - mv $BUILD_APPDIR/opt/sulla-desktop/resources/resources/linux/lima/bin/qemu-* $BUILD_APPDIR/usr/bin
  - mv $BUILD_APPDIR/opt/sulla-desktop/resources/resources/linux/lima/share/qemu $BUILD_APPDIR/usr/share
  - mv $BUILD_APPDIR/opt/sulla-desktop/resources/resources/linux/lima/lib $BUILD_APPDIR/usr
  - cp /usr/lib64/libcairo* $BUILD_APPDIR/usr/lib64/
  - ln -s ../../opt/sulla-desktop/sulla-desktop $BUILD_APPDIR/usr/bin/sulla-desktop
  - ln -s ../share/qemu $BUILD_APPDIR/usr/bin/pc_bios
