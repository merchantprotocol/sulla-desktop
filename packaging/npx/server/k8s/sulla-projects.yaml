apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-projects
  namespace: sulla
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sulla-projects}}
  template:
    metadata: {labels: {app: sulla-projects}}
    spec:
      containers:
        - name: projects
          image: __SULLA_PROJECTS_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8793}]
          env:
            - {name: SULLA_PROJECTS_MODE, value: server}
            - {name: SULLA_PROJECTS_PORT, value: "8793"}
            - {name: SULLA_PROJECTS_DATABASE_NAME, value: sulla_projects}
            - {name: SULLA_PROJECTS_DATABASE_OWNER, value: sulla}
            - {name: SULLA_PROJECTS_DATABASE_ROLE, value: sulla_projects_service}
            - {name: SULLA_PROJECTS_ADMIN_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: postgres-admin-database-url}}}
            - {name: SULLA_PROJECTS_MIGRATION_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: projects-migration-database-url}}}
            - {name: SULLA_PROJECTS_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: projects-database-url}}}
            - {name: SULLA_PROJECTS_DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: sulla-server, key: projects-database-password}}}
            - {name: SULLA_PROJECTS_JWT_SECRET, valueFrom: {secretKeyRef: {name: sulla-server, key: projects-jwt-secret}}}
            - {name: SULLA_PROJECTS_JWT_ISSUER, valueFrom: {secretKeyRef: {name: sulla-server, key: projects-jwt-issuer}}}
            - {name: SULLA_PROJECTS_JWT_AUDIENCE, valueFrom: {secretKeyRef: {name: sulla-server, key: projects-jwt-audience}}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-projects, namespace: sulla}
spec:
  selector: {app: sulla-projects}
  ports: [{name: http, port: 8793, targetPort: http}]
