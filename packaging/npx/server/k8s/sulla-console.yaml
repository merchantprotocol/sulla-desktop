apiVersion: apps/v1
kind: Deployment
metadata: {name: sulla-console, namespace: sulla}
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-console}}
  template:
    metadata: {labels: {app: sulla-console}}
    spec:
      volumes:
        - {name: license-state, persistentVolumeClaim: {claimName: sulla-console-license}}
        - name: server-secrets
          secret:
            secretName: sulla-server
            items:
              - {key: console-database-url, path: database-url}
              - {key: accounts-admin, path: accounts-admin}
        - {name: console-secrets, emptyDir: {medium: Memory}}
      # The console runs as uid 10001 and refuses secret files other users can
      # read, so it gets private copies owned by that user.
      initContainers:
        - name: console-secrets
          image: __SULLA_CONSOLE_IMAGE__
          securityContext: {runAsUser: 0}
          command:
            - sh
            - -ec
            - >-
              cp /run/sulla-server/database-url /run/sulla-console/database-url;
              cp /run/sulla-server/accounts-admin /run/sulla-console/accounts-admin;
              chown 10001:10001 /run/sulla-console/database-url /run/sulla-console/accounts-admin /var/lib/sulla-console;
              chmod 600 /run/sulla-console/database-url /run/sulla-console/accounts-admin
          volumeMounts:
            - {name: server-secrets, mountPath: /run/sulla-server, readOnly: true}
            - {name: console-secrets, mountPath: /run/sulla-console}
            - {name: license-state, mountPath: /var/lib/sulla-console}
      containers:
        - name: console
          image: __SULLA_CONSOLE_IMAGE__
          ports: [{name: http, containerPort: 8786}]
          env:
            - {name: SULLA_CONSOLE_PORT, value: "8786"}
            - {name: SULLA_CONSOLE_TRUSTED_PROXY, value: "1"}
            - {name: SULLA_CONSOLE_DATABASE_URL_FILE, value: /run/sulla-console/database-url}
            - {name: SULLA_ACCOUNTS_ADMIN_SECRET_FILE, value: /run/sulla-console/accounts-admin}
            - {name: SULLA_CONSOLE_ACCOUNTS_URL, value: http://sulla-accounts:3020}
            - {name: SULLA_CONSOLE_FILES_URL, value: http://sulla-files:8792}
            - {name: SULLA_CONSOLE_VAULT_URL, value: http://sulla-vault:8787}
            - {name: SULLA_CONSOLE_AGENTS_URL, value: http://sulla-agents:8789}
            - {name: SULLA_CONSOLE_WORKFLOWS_URL, value: http://sulla-workflows:8788}
            - {name: SULLA_SERVER_ID, valueFrom: {secretKeyRef: {name: sulla-server, key: server-id}}}
            - {name: SULLA_SERVER_LICENSE_STATE_FILE, value: "/var/lib/sulla-console/license.json"}
            - {name: SULLA_CLOUD_API_URL, value: "https://api.sulladesktop.com"}
            - {name: SULLA_SERVER_LICENSE_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: sulla-license, key: public-key, optional: true}}}
          volumeMounts:
            - {name: license-state, mountPath: /var/lib/sulla-console}
            - {name: console-secrets, mountPath: /run/sulla-console, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-console, namespace: sulla}
spec:
  selector: {app: sulla-console}
  ports: [{name: http, port: 8786, targetPort: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sulla-console-license, namespace: sulla}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 16Mi}}
