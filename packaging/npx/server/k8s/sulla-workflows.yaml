apiVersion: apps/v1
kind: Deployment
metadata: {name: sulla-workflows, namespace: sulla}
spec:
  replicas: 1
  selector: {matchLabels: {app: sulla-workflows}}
  template:
    metadata: {labels: {app: sulla-workflows}}
    spec:
      containers:
        - name: workflows
          image: __SULLA_WORKFLOWS_IMAGE__
          securityContext: {runAsUser: 0}
          ports: [{name: http, containerPort: 8788}]
          env:
            - {name: SULLA_WORKFLOW_MODE, value: server}
            - {name: SULLA_WORKFLOW_PORT, value: "8788"}
            - {name: SULLA_DATABASE_URL, valueFrom: {secretKeyRef: {name: sulla-server, key: workflows-database-url}}}
            - {name: SULLA_REDIS_URL, value: redis://redis:6379}
            - {name: SULLA_MANAGER_URL, value: http://sulla-workflows:8788}
            - {name: SULLA_TOOL_API_URL, value: http://sulla-tools:3000}
            - {name: SULLA_API_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: agent-api-token}}}
            - {name: SULLA_WORKFLOW_IMAGE, valueFrom: {secretKeyRef: {name: sulla-server, key: workflows-runner-image}}}
            - {name: SULLA_DOCKER_NETWORK, valueFrom: {secretKeyRef: {name: sulla-server, key: docker-network}}}
            - {name: SULLA_WORKFLOW_LAUNCHER, value: docker}
            - {name: SULLA_ACCOUNTS_URL, value: http://sulla-accounts:3020}
            - {name: SULLA_ACCOUNTS_SERVICE_ID, value: workflows}
            - {name: SULLA_ACCOUNTS_SERVICE_TOKEN_FILE, value: /run/sulla-secrets/accounts-workflows-token}
            - {name: SULLA_WORKFLOW_AUDIENCE, value: sulla-workflows}
            - {name: SULLA_WORKFLOW_ALLOWED_RUNNER_SCOPES, valueFrom: {secretKeyRef: {name: sulla-server, key: workflow-allowed-runner-scopes}}}
            - {name: SULLA_AGENTS_URL, value: http://sulla-agents:8789}
            - {name: SULLA_AGENTS_SERVICE_TOKEN_FILE, value: /run/sulla-secrets/agents-workflows-service-token}
          volumeMounts: [{name: secrets, mountPath: /run/sulla-secrets, readOnly: true}, {name: docker, mountPath: /var/run/docker.sock}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 5}
      volumes:
        - {name: secrets, secret: {secretName: sulla-server, defaultMode: 0600}}
        - {name: docker, hostPath: {path: /var/run/docker.sock, type: Socket}}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-workflows, namespace: sulla}
spec: {selector: {app: sulla-workflows}, ports: [{name: http, port: 8788, targetPort: http}]}
