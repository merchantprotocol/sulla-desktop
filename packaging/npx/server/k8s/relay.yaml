apiVersion: apps/v1
kind: Deployment
metadata: {name: sulla-relay, namespace: sulla}
spec:
  replicas: 2
  selector: {matchLabels: {app: sulla-relay}}
  template:
    metadata: {labels: {app: sulla-relay}}
    spec:
      containers:
        - name: relay
          image: __SULLA_RELAY_IMAGE__
          ports: [{name: ws, containerPort: 8790}]
          env:
            - {name: SULLA_RELAY_PORT, value: "8790"}
            - {name: SULLA_RELAY_REDIS_URL, value: redis://redis:6379}
            - {name: SULLA_RELAY_DEVICE_TOKEN_SECRET, valueFrom: {secretKeyRef: {name: sulla-server, key: relay-device-token-secret}}}
            - {name: SULLA_RELAY_INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: sulla-server, key: relay-internal-token}}}
          readinessProbe: {httpGet: {path: /healthz, port: ws}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: ws}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: sulla-relay, namespace: sulla}
spec:
  selector: {app: sulla-relay}
  ports: [{name: ws, port: 8790, targetPort: ws}]
