apiVersion: apps/v1
kind: Deployment
metadata:
  name: sulla-gateway
  namespace: sulla
spec:
  replicas: 2
  selector: {matchLabels: {app: sulla-gateway}}
  template:
    metadata: {labels: {app: sulla-gateway}}
    spec:
      containers:
        - name: gateway
          image: nginx:1.29-alpine
          ports: [{name: http, containerPort: 8787}]
          env:
            - {name: SULLA_TLS_CERT_CONTAINER_PATH, value: ""}
            - {name: SULLA_TLS_KEY_CONTAINER_PATH, value: ""}
            - {name: SULLA_CONSOLE_UPSTREAM, value: http://sulla-console:8786}
            - {name: SULLA_PUBLIC_SCHEME, valueFrom: {secretKeyRef: {name: sulla-server, key: public-scheme}}}
            - {name: SULLA_VAULT_HOST, valueFrom: {secretKeyRef: {name: sulla-server, key: vault-host}}}
            - {name: SULLA_RELAY_UPSTREAM, value: http://sulla-relay:8790}
            - {name: SULLA_VAULT_UPSTREAM, value: http://sulla-vault:8787}
          command: [sh, /etc/sulla/entrypoint.sh]
          volumeMounts:
            - {name: config, mountPath: /etc/sulla, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
      volumes:
        - name: config
          configMap:
            name: sulla-gateway
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata: {name: sulla-gateway, namespace: sulla}
spec:
  selector: {app: sulla-gateway}
  ports: [{name: http, port: 8787, targetPort: http}]
