# Every container image Desktop can start, embedded in the app so nothing is
# pulled after install. scripts/fetch-bundled-assets.ts resolves each `source`
# to a digest for the build's architecture, prefers the image's immutable
# `sha-<commit>` tag (published by the sulla-*-image workflows) as the
# reference Desktop runs, and writes resources/darwin/images/images.lock.json.
#
# Adding an image is one line. `onDemand: true` images load the first time
# they are needed instead of before the services start.
images:
  - { name: sulla-postgres, source: ghcr.io/merchantprotocol/sulla-postgres:sha-0d3b8b5560c706fb1c1e80b479891e3183a0f11a }
  - { name: redis, source: redis:7-alpine }
  - { name: sulla-accounts, source: ghcr.io/merchantprotocol/sulla-accounts:latest }
  - { name: sulla-vault, source: ghcr.io/merchantprotocol/sulla-vault:sha-a158e248fc5d3d47f3e4476eef20f6c80ea71f98 }
  - { name: sulla-relay, source: ghcr.io/merchantprotocol/sulla-relay:sha-141a6ef024e6d95d49c6008765c4bc9574b10816 }
  - { name: sulla-files, source: ghcr.io/merchantprotocol/sulla-files:sha-e400156a5c932923aaa7a09c5d841f382f3a7dc0 }
  - { name: sulla-files-fuse, source: ghcr.io/merchantprotocol/sulla-files-fuse:sha-0d3b8b5560c706fb1c1e80b479891e3183a0f11a }
  - { name: sulla-tools, source: ghcr.io/merchantprotocol/sulla-tools:sha-e76cb12f49f5a3307f274829b5d155ed6bb92e1c }
