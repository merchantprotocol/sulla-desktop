# Every container image Desktop can start, embedded in the app so nothing is
# pulled after install. scripts/fetch-bundled-assets.ts resolves each `source`
# to a digest for the build's architecture, prefers the image's immutable
# `sha-<commit>` tag (published by the sulla-*-image workflows) as the
# reference Desktop runs, and writes resources/darwin/images/images.lock.json.
#
# Adding an image is one line. `onDemand: true` images load the first time
# they are needed instead of before the services start.
images:
  - { name: sulla-postgres, source: ghcr.io/merchantprotocol/sulla-postgres:latest }
  - { name: redis, source: redis:7-alpine }
  - { name: sulla-accounts, source: ghcr.io/merchantprotocol/sulla-accounts:latest }
  - { name: sulla-vault, source: ghcr.io/merchantprotocol/sulla-vault:sha-04f4c51bea0ba23396a535f72d0fbd82aa082e89 }
  - { name: sulla-relay, source: ghcr.io/merchantprotocol/sulla-relay:latest }
  - { name: sulla-files, source: ghcr.io/merchantprotocol/sulla-files:sha-c23fb4070a363cde03ea1857cd9f04ab4a7b7b57 }
  - { name: sulla-files-fuse, source: ghcr.io/merchantprotocol/sulla-files-fuse:latest }
  - { name: sulla-tools, source: ghcr.io/merchantprotocol/sulla-tools:sha-52a009b7a0d9edb1a80699401fa9a733e253c851 }
  - { name: sulla-workflows, source: ghcr.io/merchantprotocol/sulla-workflows:latest }
  - { name: sulla-threat-proxy, source: ghcr.io/merchantprotocol/sulla-threat-proxy:latest }
  - { name: sulla-python-runtime, source: ghcr.io/merchantprotocol/sulla-python-runtime:latest }
  - { name: sulla-shell-runtime, source: ghcr.io/merchantprotocol/sulla-shell-runtime:latest }
  - { name: sulla-node-runtime, source: ghcr.io/merchantprotocol/sulla-node-runtime:latest }
  - { name: sulla-agent, source: ghcr.io/merchantprotocol/sulla-agent:latest, onDemand: true }
