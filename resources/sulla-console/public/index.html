<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sulla Server Console</title>
  <link rel="stylesheet" href="/console/shell.css">
</head>
<body>
  <section id="auth-gate" class="auth-gate" aria-labelledby="auth-title">
    <span class="empty-mark" aria-hidden="true">S</span>
    <p class="eyebrow">Sulla Server</p>
    <h1 id="auth-title">Sign in to your console</h1>
    <p id="auth-message">Accounts protects every service with one session.</p>
    <a id="gate-signin" class="primary-action" href="/accounts-api/v1/web/login">Continue with Accounts</a>
  </section>

  <div id="console-shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-copy"><b id="organization-name">Sulla Server</b><small>Console</small></span>
      </div>

      <nav aria-label="Server console">
        <button class="nav-item" type="button" data-area="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>Overview</span>
        </button>
        <button class="nav-item" type="button" data-area="people">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 19h5a4.5 4.5 0 0 0-3-4.2"/></svg><span>People</span>
        </button>
        <button class="nav-item" type="button" data-area="devices">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg><span>Devices</span>
        </button>

        <p class="nav-group">Data</p>
        <button class="nav-item" type="button" data-area="files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Files</span>
        </button>
        <button class="nav-item" type="button" data-area="audit-log">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 9h14M5 13h14M5 17h8"/><circle cx="17" cy="17" r="3"/></svg><span>Audit Log</span>
        </button>

        <p class="nav-group">Workloads</p>
        <button class="nav-item" type="button" data-area="agents-pods">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="13.5" r="1"/><circle cx="15" cy="13.5" r="1"/></svg><span>Agents &amp; pods</span>
        </button>
        <button class="nav-item" type="button" data-area="workflows">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8M18 8v8M16 18H9a3 3 0 0 1-3-3V8"/></svg><span>Workflows</span>
        </button>

        <p class="nav-group">Server</p>
        <button class="nav-item" type="button" data-area="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span>
        </button>
      </nav>

      <div class="account-controls">
        <div id="connection" class="connection" data-state="idle"><span></span><div><b id="account-status" role="status">Signed in</b><small id="service-status">Choose a section</small></div></div>
        <a id="signin" href="/accounts-api/v1/web/login">Sign in</a>
        <label id="organization-label" hidden><span>Organization</span><select id="organization" aria-label="Organization"></select></label>
        <button id="signout" type="button" hidden>Sign out</button>
      </div>
    </aside>

    <main>
      <header>
        <button id="back" type="button" hidden aria-label="Back to console menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span>Back to console</span>
        </button>
        <div id="header-title"><p>Sulla Server</p><h1 id="service-title">Console</h1></div>
      </header>
      <section id="empty-state" class="empty-state">
        <span class="empty-mark" aria-hidden="true">S</span>
        <h2>Server console</h2>
        <p>Choose an available section from the sidebar.</p>
      </section>
      <iframe id="service-frame" title="Sulla service" referrerpolicy="no-referrer" hidden></iframe>
    </main>
  </div>
  <script type="module" src="/console/shell.js"></script>
</body>
</html>
