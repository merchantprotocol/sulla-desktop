<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Context Menu</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        color-scheme: dark;
        --menu-bg: #0d1524;
        --menu-border: rgba(168, 192, 220, .18);
        --menu-shadow: 0 12px 48px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .04);
        --text: #f3f5f8;
        --text-muted: #a9b3c1;
        --text-dim: #7f8a99;
        --hover: rgba(255, 255, 255, .08);
        --accent: #5096b3;
        --danger: #f85149;
      }
      html.light-mode, html.theme-studio-light, html.theme-default-light {
        color-scheme: light;
        --menu-bg: #fff;
        --menu-border: oklch(88.5% .014 240);
        --menu-shadow: 0 20px 48px oklch(25% .03 250 / .16), 0 3px 10px oklch(25% .03 250 / .07);
        --text: oklch(18% .025 260);
        --text-muted: oklch(36% .025 260);
        --text-dim: oklch(60% .018 240);
        --hover: color-mix(in oklab, var(--text) 7%, var(--menu-bg));
        --accent: oklch(52% .14 240);
        --danger: oklch(55% .21 25);
      }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      .surface { position: relative; width: 100%; height: 100%; }
      .menu {
        position: absolute; top: 4px; left: 4px; width: 240px; max-height: calc(100vh - 8px); overflow-y: auto;
        padding: 4px; border: 1px solid var(--menu-border); border-radius: 10px;
        background: var(--menu-bg); box-shadow: var(--menu-shadow);
      }
      .submenu {
        position: absolute; top: 4px; left: 248px; width: 204px; max-height: calc(100vh - 8px); overflow-y: auto;
        padding: 4px; border: 1px solid var(--menu-border); border-radius: 10px;
        background: var(--menu-bg); box-shadow: var(--menu-shadow);
      }
      .menu-item {
        display: flex; align-items: center; width: 100%; height: 30px; gap: 10px; padding: 0 8px;
        border: 0; border-radius: 6px; background: transparent; color: var(--text); font: inherit;
        text-align: left; white-space: nowrap; cursor: default;
      }
      .menu-item:is(:hover, :focus-visible, .open) { outline: none; background: var(--hover); }
      .menu-item:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--accent) 55%, transparent); }
      .menu-item:active { background: color-mix(in oklab, var(--accent) 13%, var(--menu-bg)); }
      .menu-item.danger { color: color-mix(in oklab, var(--danger) 82%, var(--text)); }
      .menu-item.danger:hover, .menu-item.danger:focus-visible { background: color-mix(in oklab, var(--danger) 10%, transparent); }
      .menu-icon { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .menu-item.danger .menu-icon { stroke: currentColor; }
      .menu-label { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
      .separator { height: 1px; margin: 4px 8px; background: color-mix(in oklab, var(--text) 10%, transparent); }
      .group-dot { width: 10px; height: 10px; flex: none; margin: 0 3px; border-radius: 50%; }
      .arrow { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .check { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .unnamed { color: var(--text-muted); }
      .menu.attention {
        width: calc(100% - 8px); min-width: 0; max-height: calc(100vh - 8px); overflow-y: auto;
        padding: 5px; background: var(--strip-bg-elevated, Canvas); border-color: var(--strip-border-default, ButtonBorder);
        box-shadow: var(--strip-elev-raised, none); font: 12px/1.35 system-ui, sans-serif;
      }
      .attention-heading { padding: 7px 8px; font-weight: 600; color: var(--strip-text-muted, GrayText); }
      .attention .menu-item { height: 49px; padding: 6px 8px; border-radius: 8px; color: var(--strip-text-primary, CanvasText); }
      .attention .menu-item:is(:hover, :focus-visible) { background: var(--strip-bg-surface-hover, ButtonFace); }
      .attention .menu-icon { opacity: 1; }
      .attention-dot { flex: 0 0 8px; height: 8px; border-radius: 50%; background: var(--strip-status-warning, currentColor); }
      .attention-dot.stalled { background: var(--strip-status-error, currentColor); }
      .attention-copy { min-width: 0; }
      .attention-title, .attention-reason { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .attention-title { font-weight: 600; }
      .attention-reason { color: var(--strip-text-muted, GrayText); font-size: 12px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="surface" id="surface">
      <div class="menu" id="menu" role="menu"></div>
      <div class="submenu" id="submenu" role="menu" hidden></div>
    </div>
    <script>
      const { ipcRenderer } = require('electron');
      const menu = document.getElementById('menu');
      const submenu = document.getElementById('submenu');
      let renderedRequestId;
      let groupOptions = [];
      let activeGroupId;

      const ICONS = {
        pin: ['<path d="M12 17v5" />', '<path d="M5 3h14l-3 6v4l2 2H6l2-2V9L5 3z" />'],
        unpin: ['<path d="M12 17v5" />', '<path d="M5 3h14l-3 6v4l2 2H6l2-2V9L5 3z" />', '<path d="M3 3l18 18" />'],
        rename: ['<path d="M4 20h4L19 9l-4-4L4 16v4z" />', '<path d="M13.5 6.5l4 4" />'],
        close: ['<path d="M18 6L6 18M6 6l12 12" />'],
        closeOther: ['<path d="M9 3H5a2 2 0 0 0-2 2v4" />', '<path d="M15 3h4a2 2 0 0 1 2 2v4" />', '<path d="M9 21H5a2 2 0 0 1-2-2v-4" />', '<path d="M15 21h4a2 2 0 0 0 2-2v-4" />', '<path d="M14 10l-4 4M10 10l4 4" />'],
        closeRight: ['<path d="M2.75 8h7.5M7.5 5l3 3-3 3M13.25 3.5v9" />'],
        duplicate: ['<rect x="5.25" y="5.25" width="8" height="8" rx="1.5" />', '<path d="M10.75 5.25v-1a1.5 1.5 0 0 0-1.5-1.5h-5a1.5 1.5 0 0 0-1.5 1.5v5a1.5 1.5 0 0 0 1.5 1.5h1" />'],
        moveNewWindow: ['<rect x="2.75" y="3.25" width="10.5" height="9.5" rx="1.5" />', '<path d="M2.75 6.25h10.5" />'],
        moveStart: ['<path d="M11 17l-5-5 5-5M18 17l-5-5 5-5" />'],
        moveEnd: ['<path d="M13 7l5 5-5 5M6 7l5 5-5 5" />'],
        reload: ['<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16M16 16h5v5" />'],
        copyUrl: ['<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />'],
        addToNewGroup: ['<rect x="2.25" y="5.25" width="8.5" height="8.5" rx="2" />', '<path d="M12.25 1.75v4M10.25 3.75h4" />'],
        addToGroup: ['<rect x="2.25" y="2.25" width="8" height="8" rx="2" />', '<path d="M5.75 13.75h6a2 2 0 0 0 2-2v-6" />'],
        removeFromGroup: ['<rect x="2.25" y="5.25" width="8.5" height="8.5" rx="2" />', '<path d="M10.25 3.75h4" />'],
        renameGroup: ['<path d="M4 20h4L19 9l-4-4L4 16v4z" />', '<path d="M13.5 6.5l4 4" />'],
        ungroup: ['<rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2.5" stroke-dasharray="2.6 2.4" />'],
        closeGroup: ['<rect x="2.75" y="2.75" width="10.5" height="10.5" rx="2.5" />', '<path d="M6 6l4 4M10 6l-4 4" />'],
        changeGroupColor: ['<circle cx="8" cy="8" r="5.25" />', '<path d="M8 2.75v10.5M2.75 8h10.5" />'],
      };
      const LABELS = {
        pin: 'Pin Tab', unpin: 'Unpin Tab', rename: 'Rename Tab', close: 'Close Tab', closeOther: 'Close Other Tabs',
        closeRight: 'Close Tabs to the Right', duplicate: 'Duplicate Tab', moveNewWindow: 'Move Tab to New Window',
        moveStart: 'Move to Start', moveEnd: 'Move to End', reload: 'Reload', copyUrl: 'Copy URL',
        addToNewGroup: 'Add to New Group', addToGroup: 'Add to Group', removeFromGroup: 'Remove from Group',
        renameGroup: 'Rename Group', changeGroupColor: 'Change Color', ungroup: 'Ungroup', closeGroup: 'Close Group',
      };

      function icon(name) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 16 16');
        svg.setAttribute('class', 'menu-icon');
        svg.setAttribute('aria-hidden', 'true');
        for (const pathData of ICONS[name] || []) {
          const path = document.createElementNS(svg.namespaceURI, 'path');
          for (const [key, value] of Object.entries(Object.fromEntries([...pathData.matchAll(/(d|stroke-linejoin|stroke-linecap|stroke-dasharray)="([^"]+)"/g)].map(match => [match[1], match[2]])))) path.setAttribute(key, value);
          svg.appendChild(path);
        }
        return svg;
      }

      function setAction(button, requestId) {
        button.addEventListener('click', () => ipcRenderer.send('tab-context-menu:action', requestId, button.dataset.action));
      }

      function makeItem(action, requestId) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'menu-item';
        button.dataset.action = action;
        button.setAttribute('role', 'menuitem');
        button.appendChild(icon(action));
        const label = document.createElement('span');
        label.className = 'menu-label';
        label.textContent = LABELS[action] || action;
        button.appendChild(label);
        if (action === 'addToGroup') {
          button.setAttribute('aria-haspopup', 'menu');
          button.setAttribute('aria-expanded', 'false');
          const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          arrow.setAttribute('viewBox', '0 0 16 16');
          arrow.setAttribute('class', 'arrow');
          arrow.setAttribute('aria-hidden', 'true');
          const path = document.createElementNS(arrow.namespaceURI, 'path');
          path.setAttribute('d', 'M6.25 4 10.25 8l-4 4');
          arrow.appendChild(path);
          button.appendChild(arrow);
          button.addEventListener('mouseenter', () => openSubmenu(button, requestId));
          button.addEventListener('focus', () => openSubmenu(button, requestId));
          button.addEventListener('click', () => openSubmenu(button, requestId));
        } else {
          if (action === 'closeGroup') button.classList.add('danger');
          setAction(button, requestId);
        }
        return button;
      }

      function openSubmenu(parent, requestId) {
        if (!groupOptions.length || submenu.hidden === false) return;
        submenu.replaceChildren();
        for (const group of groupOptions) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'menu-item';
          button.dataset.action = 'joinGroup:' + group.id;
          button.setAttribute('role', 'menuitem');
          const dot = document.createElement('span');
          dot.className = 'group-dot';
          dot.setAttribute('aria-hidden', 'true');
          dot.style.backgroundColor = group.color;
          button.appendChild(dot);
          const label = document.createElement('span');
          label.className = 'menu-label' + (group.name ? '' : ' unnamed');
          label.textContent = group.name || 'Unnamed group';
          button.appendChild(label);
          if (group.id === activeGroupId) {
            const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            check.setAttribute('viewBox', '0 0 16 16');
            check.setAttribute('class', 'check');
            check.setAttribute('aria-hidden', 'true');
            const path = document.createElementNS(check.namespaceURI, 'path');
            path.setAttribute('d', 'M3.5 8.5l3 3 6-7');
            check.appendChild(path);
            button.appendChild(check);
          }
          setAction(button, requestId);
          submenu.appendChild(button);
        }
        submenu.hidden = false;
        const desiredTop = parent.getBoundingClientRect().top;
        submenu.style.top = `${ Math.max(4, Math.min(desiredTop, innerHeight - submenu.offsetHeight - 4)) }px`;
        parent.classList.add('open');
        parent.setAttribute('aria-expanded', 'true');
      }

      function closeSubmenu() {
        submenu.hidden = true;
        menu.querySelector('[data-action="addToGroup"]')?.classList.remove('open');
        menu.querySelector('[data-action="addToGroup"]')?.setAttribute('aria-expanded', 'false');
      }

      function attentionRow(row, requestId) {
        const button = document.createElement('button');
        const copy = document.createElement('span');
        const title = document.createElement('span');
        const reason = document.createElement('span');
        button.type = 'button';
        button.className = 'menu-item';
        button.dataset.action = 'attention:' + row.id;
        button.setAttribute('role', 'menuitem');
        copy.className = 'attention-copy';
        title.className = 'attention-title';
        title.dir = 'auto';
        title.textContent = row.title;
        reason.className = 'attention-reason';
        reason.textContent = row.reason;
        copy.append(title, reason);
        if (row.iconPath) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          const path = document.createElementNS(svg.namespaceURI, 'path');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('class', 'menu-icon');
          svg.setAttribute('aria-hidden', 'true');
          path.setAttribute('d', row.iconPath);
          svg.appendChild(path);
          button.appendChild(svg);
        } else {
          const dot = document.createElement('span');
          dot.className = row.state === 'stalled' ? 'attention-dot stalled' : 'attention-dot';
          dot.setAttribute('aria-hidden', 'true');
          button.appendChild(dot);
        }
        button.appendChild(copy);
        button.addEventListener('click', () => ipcRenderer.send('tab-context-menu:action', requestId, button.dataset.action));
        return button;
      }

      function buildMenu(data) {
        renderedRequestId = data.requestId;
        menu.classList.toggle('attention', Boolean(data.attention));
        menu.replaceChildren();
        closeSubmenu();
        if (data.attention) {
          const paletteTokens = ['bg-elevated', 'bg-surface-hover', 'border-default', 'elev-raised', 'text-primary', 'text-muted', 'status-warning', 'status-error'];
          for (const token of paletteTokens) menu.style.setProperty('--strip-' + token, data.attention.palette?.[token] || '');
          const heading = document.createElement('div');
          heading.className = 'attention-heading';
          heading.textContent = data.attention.title || 'Group tabs';
          menu.appendChild(heading);
          for (const row of data.items || []) menu.appendChild(attentionRow(row, data.requestId));
          menu.querySelector('.menu-item')?.focus({ preventScroll: true });
          return;
        }

        groupOptions = Array.isArray(data.groups) ? data.groups : [];
        activeGroupId = data.activeGroupId;
        for (const token of ['bg-elevated', 'bg-surface-hover', 'border-default', 'elev-raised', 'text-primary', 'text-muted', 'status-warning', 'status-error']) {
          menu.style.removeProperty('--strip-' + token);
        }
        for (const action of data.items || []) {
          if (action === '---') {
            const separator = document.createElement('div');
            separator.className = 'separator';
            separator.setAttribute('role', 'separator');
            menu.appendChild(separator);
          } else if (typeof action === 'string' && Object.hasOwn(LABELS, action) && (action !== 'addToGroup' || groupOptions.length > 0)) {
            const button = makeItem(action, data.requestId);
            if (action !== 'addToGroup') button.addEventListener('mouseenter', closeSubmenu);
            menu.appendChild(button);
          }
        }
      }

      ipcRenderer.on('tab-context-menu:data', (_event, data) => {
        buildMenu(data);
        [...document.documentElement.classList].filter(name => name.startsWith('theme-')).forEach(name => document.documentElement.classList.remove(name));
        if (data.themeId) document.documentElement.classList.add('theme-' + data.themeId);
        document.documentElement.classList.toggle('light-mode', data.theme === 'light');
        menu.querySelector('.menu-item')?.focus({ preventScroll: true });
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && renderedRequestId) {
          event.preventDefault();
          ipcRenderer.send('tab-context-menu:dismiss', renderedRequestId);
        } else if (event.key === 'ArrowRight' && document.activeElement?.dataset.action === 'addToGroup') {
          event.preventDefault();
          openSubmenu(document.activeElement, renderedRequestId);
          submenu.querySelector('.menu-item')?.focus({ preventScroll: true });
        } else if (event.key === 'ArrowLeft' && document.activeElement?.closest('.submenu')) {
          event.preventDefault();
          closeSubmenu();
          menu.querySelector('[data-action="addToGroup"]')?.focus({ preventScroll: true });
        } else if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && document.activeElement?.closest('.menu, .submenu')) {
          const list = document.activeElement.closest('.submenu') || menu;
          const buttons = [...list.querySelectorAll('button:not([disabled])')];
          const index = buttons.indexOf(document.activeElement);
          const next = index < 0 ? (event.key === 'ArrowDown' ? 0 : buttons.length - 1)
            : (index + (event.key === 'ArrowDown' ? 1 : buttons.length - 1)) % buttons.length;
          event.preventDefault();
          buttons[next]?.focus();
        }
      });
    </script>
  </body>
</html>
