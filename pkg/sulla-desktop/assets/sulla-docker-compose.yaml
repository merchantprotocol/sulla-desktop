services:
  postgres:
    image: ghcr.io/merchantprotocol/sulla-postgres:latest
    container_name: sulla_postgres
    ports:
      - "127.0.0.1:30116:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=sulla
      - POSTGRES_PASSWORD=sulla_dev_password
      - POSTGRES_DB=sulla
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - "sulla_postgres_data:/var/lib/postgresql/data"
    # Sized for a small guest (2 GB on an 8 GB Mac) that also holds Docker,
    # the kernel and every other service. shared_buffers is shared memory the
    # kernel cannot reclaim, so it stays small; the guest page cache does the
    # rest of the caching. Durability settings (fsync, synchronous_commit,
    # full_page_writes) keep their safe defaults.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      # Planner hint only; allocates nothing.
      - -c
      - effective_cache_size=256MB
      # Per sort/hash step per backend.
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - autovacuum_work_mem=32MB
      - -c
      - autovacuum_max_workers=2
      # Each parallel worker is another backend with its own work_mem; a
      # single-user desktop gains little from them.
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - huge_pages=off
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - random_page_cost=1.1
      - -c
      - shared_preload_libraries=pg_stat_statements
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sulla"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sulla_redis
    ports:
      - "127.0.0.1:30117:6379"
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  python_runtime:
    image: ghcr.io/merchantprotocol/sulla-python-runtime:latest
    container_name: sulla_python_runtime
    ports:
      - "127.0.0.1:30118:8080"
    volumes:
      - "/mnt/data/sulla/runtime/functions/catalog:/var/functions:ro"
      - "/mnt/data/sulla/runtime/functions/invocations:/var/db-functions:ro"
      - "sulla_python_runtime_cache:/opt/sulla/cache/deps"
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  shell_runtime:
    image: ghcr.io/merchantprotocol/sulla-shell-runtime:latest
    container_name: sulla_shell_runtime
    ports:
      - "127.0.0.1:30119:8080"
    volumes:
      - "/mnt/data/sulla/runtime/functions/catalog:/var/functions:ro"
      - "/mnt/data/sulla/runtime/functions/invocations:/var/db-functions:ro"
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  node_runtime:
    image: ghcr.io/merchantprotocol/sulla-node-runtime:latest
    container_name: sulla_node_runtime
    ports:
      - "127.0.0.1:30120:8080"
    volumes:
      - "/mnt/data/sulla/runtime/functions/catalog:/var/functions:ro"
      - "/mnt/data/sulla/runtime/functions/invocations:/var/db-functions:ro"
      - "sulla_node_runtime_cache:/opt/sulla/cache/node_modules"
    restart: unless-stopped
    mem_limit: 768m
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  sulla_postgres_data:
  sulla_python_runtime_cache:
  sulla_node_runtime_cache:
  sulla-files-data:
