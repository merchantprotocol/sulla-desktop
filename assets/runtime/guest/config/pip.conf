# The guest's system Python. Packages install under /usr/local, which the
# runtime agent bind-mounts from the data disk, so they survive reboots.
# Nothing manages /usr here (there is no apk), so PEP 668 does not apply.
# A venv has its own sys.prefix and never reads this file. `--target` and
# `--user` conflict with the prefix; add `--prefix=` to clear it for those.
[global]
break-system-packages = true
root-user-action = ignore

[install]
prefix = /usr/local
