version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - unnamedResult
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gosec:
      config:
        G306: "0644"
    mnd:
      # don't include the "operation" and "assign"
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - ^make$
        - ^net\.IPv4$
        - ^os\.FileMode$
        - ^os\.Mkdir(?:All)?$
        - ^os\.(?:Open|Write)File$
        - ^strings\.SplitN$
        - ^tabwriter\.NewWriter$
        - ^utils\.GetParentDir$
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: _test\.go
      - # Ignore errors from syscall
        linters:
          - dogsled
        source: ^\s*_, _, _ = .*\.Call\(

formatters:
  enable:
    - gofmt
    - gci
  exclusions:
    generated: lax
  settings:
    gci:
      sections:
      - standard
      - default
      - prefix(github.com/rancher-sandbox/rancher-desktop) # localmodule for go.work
